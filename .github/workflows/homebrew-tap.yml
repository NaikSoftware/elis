name: Homebrew tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to the cask, for example v1.0.1
        required: true

permissions:
  contents: read

concurrency: homebrew-tap

jobs:
  cask:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read the DMG digest
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag $TAG is not vX.Y.Z"; exit 1; }
          version="${TAG#v}"
          digest=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            -q ".assets[] | select(.name == \"Elis-$version.dmg\") | .digest")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no Elis-$version.dmg digest on $TAG"; exit 1; }
          echo "VERSION=$version" >>"$GITHUB_ENV"
          echo "SHA256=${digest#sha256:}" >>"$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          repository: NaikSoftware/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Update the cask
        run: |
          sed -i -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" Casks/elis.rb
          if git diff --quiet; then echo "cask already at $VERSION"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "elis $VERSION"
          git push
